<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>littleHome Item Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="littleHome Guild Item Reservation System">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#121212">
</head>

<body>

  <div class="container">
    <h1><span id="admin-trigger" style="cursor: default; user-select: none;">🏠</span> littleHome Item Reservation</h1>
    <div id="admin-actions" class="header-actions hidden">
      <button class="reset-btn" onclick="resetReservations()">🔄 Reset All Reservations</button>
    </div>

    <div id="items-container" class="items-grid">
      <!-- Items will be injected here by JS -->
    </div>
    <div id="pagination" class="pagination">
      <!-- Pagination will be injected here by JS -->
    </div>
    <div id="summary-container" class="summary-section">
      <!-- Summary will be injected here by JS -->
    </div>
  </div>

</body>

</html>
