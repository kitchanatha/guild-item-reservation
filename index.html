<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>littleHome Item Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="littleHome Guild Item Reservation System">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#121212">
</head>

<body>

  <div class="container">
    <h1><span id="admin-trigger" style="display: inline-block; cursor: default; user-select: none; padding: 0 10px;">🏠</span> littleHome Item Reservation</h1>
    <div id="admin-actions" class="header-actions hidden">
      <button class="reset-btn" onclick="resetReservations()">🔄 Reset All Reservations</button>
      <button class="export-btn" onclick="exportData()">📤 Export JSON</button>
      <button class="import-btn" onclick="importData()">📥 Import JSON</button>
      
      <div class="admin-setting">
        <label for="items-per-page">Items per page:</label>
        <select id="items-per-page" onchange="updateItemsPerPage()">
          <option value="4">4</option>
          <option value="8">8</option>
          <option value="12">12</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      
      <div class="supabase-config">
        <h3>Cloud Sync (Supabase)</h3>
        <input type="text" id="supabase-url" placeholder="Supabase URL (https://xyz.supabase.co)">
        <input type="password" id="supabase-key" placeholder="Supabase Anon Key">
        <button onclick="saveSupabaseConfig()">💾 Save & Connect</button>
        <p class="hint">Leave empty to use Local Storage</p>
      </div>
    </div>

    <div class="user-settings">
      <div id="sync-status" class="sync-status status-local">● Mode: Local Storage</div>
      <input type="text" id="global-ign" placeholder="Enter your IGN to claim items" oninput="saveGlobalIGN()">
      <p class="hint">Click any available item below to claim it!</p>
    </div>

    <div id="items-container" class="items-grid">
      <!-- Items will be injected here by JS -->
    </div>

    <div class="pagination-controls">
      <button onclick="changePage(-1)">⬅️ Previous</button>
      <span id="page-indicator">Page 1 of 25</span>
      <button onclick="changePage(1)">Next ➡️</button>
    </div>

    <div id="summary-container" class="summary-section">
      <!-- Summary will be injected here by JS -->
    </div>
  </div>

</body>

</html>
