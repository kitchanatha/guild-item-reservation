<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>littleHome Item Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="littleHome Guild Item Reservation System">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#121212">
</head>

<body>

  <div class="container">
    <h1>🏠 littleHome Item Reservation</h1>

    <nav class="view-nav">
      <button id="btn-items" class="nav-btn active" onclick="showView('items')">Items Grid</button>
      <button id="btn-summary" class="nav-btn" onclick="showView('summary')">Summary View</button>
    </nav>

    <div id="view-items" class="view-content">
      <div id="items-container" class="items-grid">
        <!-- Items will be injected here by JS -->
      </div>
      <div id="pagination" class="pagination">
        <!-- Pagination will be injected here by JS -->
      </div>
    </div>

    <div id="view-summary" class="view-content hidden">
      <div id="summary-container" class="summary-section">
        <!-- Summary will be injected here by JS -->
      </div>
    </div>
  </div>

</body>

</html>
